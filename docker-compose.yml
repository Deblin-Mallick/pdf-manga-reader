version: '3.8'

services:
db:
image: postgres:15-alpine
container_name: pdf-manga-reader-db
environment:
POSTGRES_USER: ${DB_USER:-reader_user}
POSTGRES_PASSWORD: ${DB_PASSWORD:-reader_password}
POSTGRES_DB: ${DB_NAME:-reader_db}
volumes:
- pgdata:/var/lib/postgresql/data
restart: unless-stopped

backend:
build:
context: .
dockerfile: backend/Dockerfile
container_name: pdf-manga-reader-backend
ports:
- "8000:8000"
environment:
- GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
- JWT_SECRET=${JWT_SECRET:-super-secret-manga-reader-token-key-2026}
- ENVIRONMENT=production
- DATABASE_URL=postgresql://${DB_USER:-reader_user}:${DB_PASSWORD:-reader_password}@db:5432/${DB_NAME:-reader_db}
depends_on:
- db
volumes:
- /root/portainerDB/stacks/pdf-manga-reader/uploads:/app/uploads
- /root/portainerDB/stacks/pdf-manga-reader/covers:/app/covers
restart: unless-stopped

volumes:
pgdata:
