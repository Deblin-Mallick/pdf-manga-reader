version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: pdf-manga-reader-db-${USER_ID:-default}
    environment:
      POSTGRES_USER: ${DB_USER:-reader_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-reader_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pdf-manga-reader-backend-${USER_ID:-default}
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - JWT_SECRET=${JWT_SECRET}
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://${DB_USER:-reader_user}:${DB_PASSWORD}@db:5432/${DB_NAME:-reader_db}
    depends_on:
      - db
    volumes:
      - uploads_data:/app/uploads
      - covers_data:/app/covers
      - sqlite_data:/app/data
    restart: unless-stopped

# volumes:
#   pgdata:
#   uploads_data:
#   covers_data:
#   sqlite_data:

volumes:
  pgdata:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${NAS_IP:-192.168.2.119},rw,nolock,hard,nfsvers=4"
      device: ":${NAS_PATH:-/Volume1/Database_server}/postgresql/data"

  uploads_data:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${NAS_IP:-192.168.2.119},rw,nolock,hard,nfsvers=4"
      device: ":${NAS_PATH:-/Volume1/Database_server}/uploads"

  covers_data:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${NAS_IP:-192.168.2.119},rw,nolock,hard,nfsvers=4"
      device: ":${NAS_PATH:-/Volume1/Database_server}/covers"

  sqlite_data:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${NAS_IP:-192.168.2.119},rw,nolock,hard,nfsvers=4"
      device: ":${NAS_PATH:-/Volume1/Database_server}/data"